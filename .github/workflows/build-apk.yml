name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso para avisos puntuales
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#121612' --iconBackgroundColorDark '#121612' --splashBackgroundColor '#121612' --splashBackgroundColorDark '#121612'

      - name: Copiar la app al proyecto
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TokersAgenda.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TokersAgenda-apk
          path: out/TokersAgenda.apk

      - name: Publicar en la rama apk
        run: |
          cd out
          git init -q
          git checkout -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add TokersAgenda.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
